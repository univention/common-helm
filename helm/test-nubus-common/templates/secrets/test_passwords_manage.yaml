# Only rendered by tests/nubus-common/secrets/test_passwords_manage.py.
{{- if .Values.testPasswordsManage }}
apiVersion: local.test/v1
kind: Stub
metadata:
  name: secrets-passwords-manage
data:
  generate: {{ include "nubus-common.secrets.generatePasswords" . | quote }}
  password: {{
    include "nubus-common.secrets.passwords.manage"
      ( dict
        "secret" "stub-secret"
        "key" "password"
        "providedValues" ( list "client.auth.password" )
        "username" "stub-username"
        "context" .
      ) | quote }}
{{- end }}
